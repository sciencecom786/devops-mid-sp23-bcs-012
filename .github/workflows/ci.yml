name: DevOps Mid CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and generate JSON report
        id: tests
        run: python run_tests.py

      - name: Send report to local receiver
        if: always() && steps.tests.outcome != 'skipped'
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python send_report.py
